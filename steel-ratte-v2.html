function tankType(id){return tankTypes.find(t=>t.id===id)||tankTypes[0];}
function wrap(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}function turn(a,b,t){return a+clamp(wrap(b-a),-t,t)}
function seeded(n){let q=Math.sin(n*127.1+311.7)*43758.5453;return q-Math.floor(q)}
function resize(){game.w=innerWidth;game.h=innerHeight;game.dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(game.w*game.dpr);canvas.height=Math.round(game.h*game.dpr);ctx.setTransform(game.dpr,0,0,game.dpr,0,0);}
function tone(freq=440,duration=.09,type='sine',volume=.025){if(game.muted)return;try{game.ac ||= new(window.AudioContext||window.webkitAudioContext)();const o=game.ac.createOscillator(),g=game.ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,game.ac.currentTime);g.gain.setValueAtTime(volume,game.ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,game.ac.currentTime+duration);o.connect(g);g.connect(game.ac.destination);o.start();o.stop(game.ac.currentTime+duration);}catch(_){}}
function say(text){game.toast=text;game.toastTime=2.2;}
function makeArena(){
  const bg=document.createElement('canvas');bg.width=W;bg.height=H;const c=bg.getContext('2d');
  c.fillStyle='#83bc78';c.fillRect(0,0,W,H);
  for(let i=0;i<85;i++){const x=seeded(i+4)*W,y=seeded(i+318)*H,r=55+seeded(i+987)*150;c.fillStyle=['rgba(192,216,120,.23)','rgba(59,135,93,.14)','rgba(231,217,143,.18)'][i%3];c.beginPath();c.ellipse(x,y,r,r*.52,seeded(i+91)*TAU,0,TAU);c.fill();}
  // A winding sandy track and a little pond give the training field clear landmarks.
  c.strokeStyle='#d5c28a';c.lineWidth=76;c.lineCap='round';c.beginPath();c.moveTo(-50,1380);c.bezierCurveTo(520,1510,560,760,1170,920);c.bezierCurveTo(1660,1050,1770,1520,2650,1290);c.stroke();
  c.strokeStyle='rgba(255,244,194,.47)';c.lineWidth=5;c.beginPath();c.moveTo(-50,1380);c.bezierCurveTo(520,1510,560,760,1170,920);c.bezierCurveTo(1660,1050,1770,1520,2650,1290);c.stroke();
  c.fillStyle='#65b7c0';c.beginPath();c.ellipse(2180,440,245,150,-.3,0,TAU);c.fill();c.strokeStyle='#d4f1dc';c.lineWidth=10;c.stroke();
  c.fillStyle='rgba(247,255,226,.42)';for(let i=0;i<22;i++){const x=200+seeded(i+71)*2200,y=180+seeded(i+117)*1670;c.beginPath();c.arc(x,y,2+seeded(i+22)*2,0,TAU);c.fill();}
  game.world=bg;
  game.rocks=[];let id=0;for(let i=0;i<31;i++){let x=180+seeded(i+1201)*(W-360),y=160+seeded(i+1401)*(H-320);if(dist({x,y},{x:W/2,y:H/2})<255)continue;if(Math.hypot((x-2180)/245,(y-440)/150)<1.35)continue;game.rocks.push({id:id++,x,y,r:25+seeded(i+1580)*32,kind:i%3});}
  // Soft hay bales, wooden blocks, and round stones are cover. No real-world battle damage.
  game.flowers=[];for(let i=0;i<260;i++){const x=seeded(i+201)*W,y=seeded(i+501)*H;game.flowers.push({x,y,color:['#f7e68d','#fff4e1','#e8a3b1','#b5a5ef'][i%4],r:1.5+seeded(i+690)*1.8});}
}
function readSavedGame(){if(game.savedGameChecked)return game.savedGame;game.savedGameChecked=true;try{const raw=localStorage.getItem('steel-ratte-save-v1');if(raw){const s=JSON.parse(raw);if(s&&s.version===1&&s.player&&Number.isFinite(s.wave))game.savedGame=s;}}catch(_){game.savedGame=null;}return game.savedGame;}
function clearSavedGame(){try{localStorage.removeItem('steel-ratte-save-v1');}catch(_){}game.savedGame=null;game.savedGameChecked=true;}
function saveGame(){if(!game.player)return;const p={...game.player,tankId:game.player.tank.id};delete p.tank;const data={version:1,wave:game.wave,score:game.score,coins:game.coins,roundCoins:game.roundCoins,ownedTanks:game.ownedTanks,player:p,bots:game.bots,shots:game.shots,pickups:game.pickups,transition:game.transition,state:game.state==='shop'?'shop':'play',shopMessage:game.shopMessage,shopPage:game.shopPage,savedAt:Date.now()};try{localStorage.setItem('steel-ratte-save-v1',JSON.stringify(data));game.savedGame=data;game.savedGameChecked=true;game.saveNoticeTime=2.4;if(game.state==='shop')game.shopMessage='Saved! Your game is stored in this browser.';else say('Game saved! You can continue from the title screen.');tone(740,.12,'sine',.035);}catch(_){if(game.state==='shop')game.shopMessage='Could not save here. Try a regular browser tab.';else say('Could not save here. Try a regular browser tab.');}}
function resumeSavedGame(){const s=readSavedGame();if(!s){start();return;}makeArena();game.wave=Math.max(1,Math.floor(s.wave));game.score=Number(s.score)||0;game.coins=Number(s.coins)||0;game.roundCoins=Number(s.roundCoins)||0;game.ownedTanks=Array.isArray(s.ownedTanks)?[...new Set(['ratte',...s.ownedTanks.filter(id=>tankTypes.some(t=>t.id===id))])]:['ratte'];const savedPlayer=s.player||{};game.player={...savedPlayer,tank:tankType(savedPlayer.tankId),powerCD:{q:0,e:0,r:0,...savedPlayer.powerCD}};game.player.mounts=Array.isArray(savedPlayer.mounts)?[...savedPlayer.mounts.slice(0,2),...Array(Math.max(0,2-savedPlayer.mounts.length)).fill(null)]:[null,null];game.player.inventory=Array.isArray(savedPlayer.inventory)?savedPlayer.inventory:[];game.player.mountCD=Array.isArray(savedPlayer.mountCD)?[...savedPlayer.mountCD.slice(0,2),...Array(Math.max(0,2-savedPlayer.mountCD.length)).fill(0)]:[0,0];game.player.mountEmptyNotice=false;delete game.player.tankId;game.bots=Array.isArray(s.bots)?s.bots:[];game.shots=Array.isArray(s.shots)?s.shots:[];game.pickups=Array.isArray(s.pickups)?s.pickups:[];game.sparks=[];game.transition=Math.max(0,Number(s.transition)||0);game.shopMessage=s.shopMessage||'Buy a tank or keep saving your coins.';game.shopPage=Math.max(0,Number(s.shopPage)||0);game.state=s.state==='shop'?'shop':'play';game.time=0;game.toastTime=0;if(!game.bots.length&&game.state==='play')spawnWave();say('Welcome back! Your saved game is ready.');tone(540,.16);}
function openTankBay(returnState){game.bayReturn=returnState||game.state;game.state='tankBay';game.bayDragging=false;game.bayRotation=game.player?.angle||0;}
function closeTankBay(){game.state=['play','pause','shop'].includes(game.bayReturn)?game.bayReturn:'play';game.bayDragging=false;}
function weaponName(id){return id==='laserShooter'?'Laser Shooter':id==='gatlingGun'?'Gatling Gun':id==='nukeLauncher'?'Nuke Launcher':'Rocket Launcher';}
function launchMounted(){const p=game.player;if(!p)return;if(p.onFoot){if(!p.mountEmptyNotice)say('Mounted guns stay on your tank.');p.mountEmptyNotice=true;return;}const mounts=(p.mounts||[]).map((id,i)=>({id,i})).filter(m=>m.id);if(!mounts.length){if(!p.mountEmptyNotice)say(p.inventory?.length?'Visit the Tank Bay to equip a weapon.':'Find a weapon drop from a bot.');p.mountEmptyNotice=true;return;}p.mountEmptyNotice=false;p.mountCD=p.mountCD||[0,0];const target=game.bots.filter(b=>b.hp>0).sort((a,b)=>dist(p,a)-dist(p,b))[0],aim=screenToWorld(game.mouse.x,game.mouse.y);let fired=false;for(const mnt of mounts){if(p.mountCD[mnt.i]>0)continue;const side=mnt.i===0?-1:1,m=muzzle(p,p.turret,57),sx=m.x+Math.cos(p.angle)*side*28,sy=m.y+Math.sin(p.angle)*side*28;if(mnt.id==='laserShooter'){const a=Math.atan2(aim.x-sx,-(aim.y-sy));game.shots.push({x:sx,y:sy,vx:Math.sin(a)*980,vy:-Math.cos(a)*980,life:1.35,from:'hero',r:7,type:'laser',damage:38});p.mountCD[mnt.i]=.38;}else if(mnt.id==='gatlingGun'){const a=Math.atan2(aim.x-sx,-(aim.y-sy))+(Math.random()-.5)*.09;game.shots.push({x:sx,y:sy,vx:Math.sin(a)*900,vy:-Math.cos(a)*900,life:1.25,from:'hero',r:4,type:'gatling',damage:11});p.mountCD[mnt.i]=.085;}else if(mnt.id==='nukeLauncher'){const a=target?Math.atan2(target.x-sx,-(target.y-sy)):Math.atan2(aim.x-sx,-(aim.y-sy));game.shots.push({x:sx,y:sy,vx:Math.sin(a),vy:-Math.cos(a),life:4.5,from:'hero',r:14,type:'nuke',damage:96,phase:'lift',age:0,height:0,targetRef:target,targetX:target?target.x:aim.x,targetY:target?target.y:aim.y});p.mountCD[mnt.i]=5.2;}else{const a=target?Math.atan2(target.x-sx,-(target.y-sy)):p.turret;game.shots.push({x:sx,y:sy,vx:Math.sin(a)*520,vy:-Math.cos(a)*520,life:2.5,from:'hero',r:10,type:'rocket',homing:!!target,damage:48});p.mountCD[mnt.i]=1.3;}fired=true;}if(fired)tone(mounts.some(m=>m.id==='gatlingGun')?640:mounts.some(m=>m.id==='laserShooter')?780:mounts.some(m=>m.id==='nukeLauncher')?180:240,.035,'triangle',.012);}
function handleTankBayClick(x,y){if(hitButton(game.bayClose,x,y)){closeTankBay();return;}for(const slot of game.baySlots){if(!hitButton(slot,x,y))continue;const p=game.player;if(p.mounts[slot.i]){if(p.inventory.length>=6){say('Your backpack is full.');return;}p.inventory.push(p.mounts[slot.i]);p.mounts[slot.i]=null;p.mountCD[slot.i]=0;say(weaponName(p.inventory[p.inventory.length-1])+' moved to your backpack.');}else if(p.inventory.length){const item=p.inventory.shift();p.mounts[slot.i]=item;p.mountCD[slot.i]=0;say(weaponName(item)+' equipped in mount '+(slot.i+1)+'!');}return;}}

function drawOverlay(){ctx.fillStyle='rgba(25,53,48,.49)';ctx.fillRect(0,0,game.w,game.h);const saved=game.state==='title'?readSavedGame():null,cw=Math.min(620,game.w-36),ch=game.state==='title'?416:290,x=(game.w-cw)/2,y=(game.h-ch)/2;round(x,y,cw,ch,28,'rgba(41,74,56,.94)','rgba(244,250,218,.58)');ctx.textAlign='center';if(game.state==='title'){ctx.fillStyle='#f3da83';ctx.font='900 12px ui-rounded,system-ui';ctx.letterSpacing='3px';ctx.fillText('A FRIENDLY TANK BOT GAME',game.w/2,y+42);ctx.letterSpacing='0';ctx.fillStyle='#fff6d4';ctx.font='1000 '+Math.min(56,cw*.105)+'px ui-rounded,system-ui';ctx.fillText('STEEL RATTE',game.w/2,y+111);ctx.fillStyle='#bfe8d1';ctx.font='800 19px ui-rounded,system-ui';ctx.fillText('BOT BOP',game.w/2,y+143);ctx.fillStyle='#eef5df';ctx.font='600 14px ui-rounded,system-ui';ctx.fillText(saved?'Saved game ready: Round '+saved.wave+' · '+saved.coins+' coins':'Drive the Steel Ratte and pop the T-34 bots!',game.w/2,y+183);ctx.fillText(saved?'Continue your saved run or start fresh.':'Earn coins each round and unlock tanks with new powers.',game.w/2,y+207);const bw=Math.min(205,(cw-48)/2),gap=12,by=y+231;game.titleButtons={play:{x:game.w/2-gap/2-bw,y:by,w:bw,h:48},tutorial:{x:game.w/2+gap/2,y:by,w:bw,h:48}};round(game.titleButtons.play.x,by,bw,48,15,'#f1d46f','#fff0b5');round(game.titleButtons.tutorial.x,by,bw,48,15,'rgba(235,241,217,.17)','rgba(247,255,226,.48)');ctx.fillStyle='#354b3c';ctx.font='900 13px ui-rounded,system-ui';ctx.fillText(saved?'CONTINUE':'PLAY',game.titleButtons.play.x+bw/2,by+30);ctx.fillStyle='#f4f5df';ctx.fillText('HOW TO PLAY',game.titleButtons.tutorial.x+bw/2,by+30);ctx.fillStyle='#f8f4d9';ctx.font=cw<450?'700 8px ui-rounded,system-ui':'700 11px ui-rounded,system-ui';ctx.fillText('W↑ A← S↓ D→ move · Mouse aim · Left click fire',game.w/2,y+316);ctx.fillText('Right click big shot · Space dash · Q / E / R powers',game.w/2,y+339);ctx.fillStyle='#bde6cf';ctx.font='600 10px ui-rounded,system-ui';ctx.fillText('Press T for tutorial. Press N for a new game.',game.w/2,y+372);}else if(game.state==='pause'){ctx.fillStyle='#f6df8c';ctx.font='900 34px ui-rounded,system-ui';ctx.fillText('PAUSED',game.w/2,y+71);ctx.fillStyle='#f5f6e4';ctx.font='600 15px ui-rounded,system-ui';ctx.fillText('Save progress or hop back in.',game.w/2,y+119);const bw=Math.min(112,(cw-48-12)/3),gap=6,by=y+159,total=bw*3+gap*2,sx=game.w/2-total/2,sb={x:sx,y:by,w:bw,h:46},gb={x:sx+bw+gap,y:by,w:bw,h:46},rb={x:sx+(bw+gap)*2,y:by,w:bw,h:46};game.saveButton=sb;game.bayButton=gb;round(sb.x,sb.y,sb.w,sb.h,14,'rgba(235,241,217,.18)','rgba(247,255,226,.38)');round(gb.x,gb.y,gb.w,gb.h,14,'rgba(235,241,217,.18)','rgba(247,255,226,.38)');round(rb.x,rb.y,rb.w,rb.h,14,'#f1d46f','#fff0b5');ctx.font='900 '+(cw<420?'9':'10')+'px ui-rounded,system-ui';ctx.fillStyle='#f5f5df';ctx.fillText(game.saveNoticeTime>0?'SAVED!':'SAVE',sb.x+sb.w/2,sb.y+28);ctx.fillText('TANK BAY',gb.x+gb.w/2,gb.y+28);ctx.fillStyle='#354b3c';ctx.fillText('RESUME',rb.x+rb.w/2,rb.y+28);}else{const won=game.state==='won';ctx.fillStyle=won?'#f3dc84':'#ffd0a8';ctx.font='900 35px ui-rounded,system-ui';ctx.fillText(won?'YOU DID IT!':'TRY AGAIN!',game.w/2,y+74);ctx.fillStyle='#f4f5e2';ctx.font='600 15px ui-rounded,system-ui';ctx.fillText(won?'Keep going!':'You reached round '+game.wave+' and earned '+game.score+' points. Try again?',game.w/2,y+123);round(game.w/2-103,y+164,206,49,15,'#f1d46f');ctx.fillStyle='#354b3c';ctx.font='900 14px ui-rounded,system-ui';ctx.fillText('PLAY AGAIN',game.w/2,y+195);}}
function frame(now){const dt=Math.min(.034,(now-game.last)/1000||0);game.last=now;game.saveNoticeTime=Math.max(0,game.saveNoticeTime-dt);if(game.state==='tankBay'&&!game.bayDragging)game.bayRotation+=dt*.45;if(game.state==='title')game.time+=dt;update(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
